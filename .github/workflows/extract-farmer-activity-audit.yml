name: Extract Farmer Activity Audit source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-farmer-activity-audit.yml'
      - 'farmer-activity-audit-system.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify archive and inspect layout
        run: |
          set -euxo pipefail
          test -f farmer-activity-audit-system.zip
          unzip -l farmer-activity-audit-system.zip | head -80
          mkdir -p /tmp/faa-source
          unzip -q farmer-activity-audit-system.zip -d /tmp/faa-source
          test -d /tmp/faa-source/faa-system
      - name: Extract application source
        run: |
          set -euxo pipefail
          cp -a /tmp/faa-source/faa-system/. .
          rm -f farmer-activity-audit-system.zip
          test -f apps/web/package.json
          test -f apps/web/app/page.tsx
          test -f apps/api/package.json
          test -f packages/shared/package.json
          test -f supabase/migrations/20261029155116_farmer_activity_audit_core.sql
      - name: Commit extracted source
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: extract farmer activity audit source"
            git push origin HEAD:main
          fi
