name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify required source files
        run: |
          test -f apps/web/package.json
          test -f apps/web/app/page.tsx
          test -f apps/api/package.json
          test -f apps/api/src/main.ts
          test -f apps/api/src/modules/activities.controller.ts
          test -f packages/shared/src/index.ts
          test -f supabase/migrations/20261029155116_farmer_activity_audit_core.sql
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck workspace packages
        run: pnpm --recursive --if-present typecheck
      - name: Build workspace packages
        run: pnpm --recursive --if-present build
