name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify required source files
        run: |
          test -f apps/web/package.json
          test -f apps/web/app/page.tsx
          test -f apps/api/package.json
          test -f apps/api/src/main.ts
          test -f apps/api/src/modules/activities.controller.ts
          test -f packages/shared/src/index.ts
          test -f apps/voice-worker/package.json
          test -f apps/job-worker/package.json
          test -f supabase/migrations/20261029155116_farmer_activity_audit_core.sql
          test -f supabase/migrations/20261029155200_faa_rls_policies.sql
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all workspace packages
        run: pnpm --recursive run typecheck
      - name: Lint web app
        run: pnpm --filter @faa/web run lint
      - name: Build all workspace packages
        run: pnpm --recursive run build

