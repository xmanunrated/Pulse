name: Unpack KhetAudit source
on:
  push:
    paths:
      - ".transfer/READY"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source archive
        run: |
          set -euo pipefail
          test -f .transfer/READY
          cat .transfer/chunk-*.b64 | base64 --decode > /tmp/khetaudit.tar.gz
          mkdir -p /tmp/khetaudit
          tar -xzf /tmp/khetaudit.tar.gz --strip-components=1 -C /tmp/khetaudit
          cp -a /tmp/khetaudit/. .
          rm -rf .transfer
      - name: Commit application source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: add KhetAudit application source"
          git push
